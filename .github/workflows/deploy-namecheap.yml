name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SSH_HOST: 68.65.122.243
      SSH_USER: errotbjg
      SSH_PORT: 21098
      APP_ROOT: ${{ vars.NAMECHEAP_APP_ROOT || '/home/errotbjg/errouissi' }}
      NODE_ACTIVATE: ${{ vars.NAMECHEAP_NODE_ACTIVATE || '/home/errotbjg/nodevenv/errouissi/24/bin/activate' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://errouissi.ma' }}
    steps:
      - uses: actions/checkout@v4
      - name: Exclude any previously committed local environment files
        run: rm -f .env .env.local .env.production .env.production.local
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package application (no secrets)
        run: |
          tar --exclude=.next/cache -czf deploy.tgz .next public app components lib proxy.ts tsconfig.json package.json package-lock.json next.config.ts server.js app.js
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Upload and deploy
        run: |
          # Limit interpolated remote paths to simple absolute paths.
          [[ "$APP_ROOT" =~ ^/home/errotbjg/[a-zA-Z0-9_/-]+$ ]]
          [[ "$NODE_ACTIVATE" =~ ^/home/errotbjg/nodevenv/[a-zA-Z0-9_/-]+/bin/activate$ ]]
          [[ "$APP_ROOT" != *..* && "$NODE_ACTIVATE" != *..* ]]
          archive="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes deploy.tgz "$SSH_USER@$SSH_HOST:$archive"
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "bash -s -- '$APP_ROOT' '$NODE_ACTIVATE' '$archive'" < scripts/deploy-namecheap.sh
