# GitLab CI/CD Pipeline for Next.js 16 (Standalone) & Coolify VPS
# Target VPS: 162.35.31.73

stages:
  - test
  - deploy

default:
  interruptible: true

variables:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

# -------------------------------------------------------------
# Cache node_modules between jobs
# -------------------------------------------------------------
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

# -------------------------------------------------------------
# Stage 1: Validation & Typecheck
# -------------------------------------------------------------
typecheck:
  stage: test
  image: node:22-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  stage: test
  image: node:22-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------
# Stage 2: Deploy to Coolify VPS
# -------------------------------------------------------------
# To configure:
# 1. Open Coolify Dashboard (http://162.35.31.73:8000)
# 2. Go to your Project -> Application -> Webhooks
# 3. Copy the "Deploy Webhook" URL
# 4. In GitLab: Settings -> CI/CD -> Variables -> Add COOLIFY_WEBHOOK_URL
deploy:coolify:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
        echo "=========================================================="
        echo "WARNING: COOLIFY_WEBHOOK_URL variable is not set."
        echo "Please add COOLIFY_WEBHOOK_URL in GitLab CI/CD Variables:"
        echo "GitLab -> Project Settings -> CI/CD -> Variables"
        echo "Value: Deploy Webhook URL from your Coolify Application"
        echo "=========================================================="
        exit 1
      fi
      echo "Triggering deployment on Coolify VPS (162.35.31.73)..."
      response=$(curl -s -w "\n%{http_code}" -X GET "$COOLIFY_WEBHOOK_URL")
      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | sed '$d')
      echo "Coolify response: $body"
      if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
        echo "Deployment successfully triggered on Coolify (HTTP $http_code)!"
      else
        echo "Deployment trigger failed with HTTP $http_code"
        exit 1
      fi
